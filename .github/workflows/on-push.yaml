name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # skip first run because nothing enabled or setup yet
    if: github.run_number != 1
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  build-site:
    # deploy even if the citation update did not succeed, so the live site is
    # never left behind by a problem in an unrelated job
    needs: update-citations
    if: always()
    uses: ./.github/workflows/build-site.yaml
