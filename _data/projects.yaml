# Projects listed on the /research/ page, in the order given here.
#
# `image` is a path in images/, `link` the project website. `tags` show up as
# labels on the card and as filters at the top of the page — when adding a new
# tag, list it in the tags include in research/index.md as well.

- title: MiA DDG
  subtitle: Mein interaktiver Assistent — ein Chatbot für Diabetes
  image: images/MiaDDG.2026.02.08.icon.png
  link: /research/mia-ddg/
  description: >-
    Ein Projekt der Kommission Digitalisierung der Deutschen Diabetes
    Gesellschaft: ein KI-gestützter Chatbot, der Wissen aus Leitlinien und
    Praxisempfehlungen evidenzbasiert und leitliniengerecht vermittelt — als
    Web-App für Menschen mit Diabetes und als Web-App für Behandelnde außerhalb
    der Diabetologie. Das barrierefreie Dialogsystem unterstützt Ein- und
    Ausgabe über Audio und passt die Schriftgrößen an.
  tags:
    - chatbot
    - medicine
    - interdisciplinary

- title: FrameIntell
  subtitle: Concepts of intelligence in the life sciences and in AI
  image: images/frameintell.png
  link: https://frameintell.de/
  description: >-
    An interdisciplinary project that compares how "intelligence" is
    conceptualised in the life sciences and in artificial intelligence,
    together with Physiology, History and Ethics of Medicine, and Linguistics.
    Our subproject provides the methods and tools for the text analysis —
    automated collection of literature from PubMed, arXiv, bioRxiv, and
    medRxiv, and NLP methods based on large language models to extract
    information, discover concept networks and their trends over time, and
    search these corpora semantically.
  tags:
    - nlp
    - qa
    - interdisciplinary

- title: EPINetz
  subtitle: Exploration of political information networks
  image: images/epinetz-logo.svg
  link: https://epinetz.de/
  description: >-
    How does digitalisation shape political opinion-forming and decision-making,
    and how does information reach the public in the age of social networks?
    EPINetz develops and tests interdisciplinary methods for exploring political
    information networks, grounded in network-based and discourse-oriented
    policy field research, and makes the results available through an
    interactive platform for researchers, journalists, teachers, and the
    interested public. Data is collected close to real time from news portals,
    social media posts by politically relevant people and organisations, and
    documents of the Bundestag. Michael Gertz is principal investigator for the
    computer science part of the project and leads the Heidelberg team.
  tags:
    - nlp
    - qa
    - interdisciplinary
