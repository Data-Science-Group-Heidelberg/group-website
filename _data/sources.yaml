# Publications listed on the /publications/ page.
#
# Two ways to add one:
#
#   1. If the work has a DOI (or arXiv / PubMed / ISBN id), a single line is
#      enough — the metadata (title, authors, venue, date) is fetched
#      automatically when the site is built:
#
#        - id: doi:10.1145/1234567.1234568
#        - id: arxiv:2506.19512
#
#   2. If there is no such id, give the metadata by hand:
#
#        - title: Title of the Publication
#          type: paper
#          authors:
#            - First Author
#            - Michael Gertz
#          publisher: Name of the Conference or Journal
#          date: 2026-06-01
#          link: https://example.org/paper
#          description: One or two sentences on what the paper is about.
#          buttons:
#            - type: link
#              text: PDF
#              link: https://example.org/paper.pdf
#          tags:
#            - natural language processing
#
# Entries below are grouped by year for readability; the page sorts them by
# date on its own.

